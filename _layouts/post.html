---
layout: default
---
<h1>{{ page.title }}</h1>
<p class="meta">{{ page.date | date_to_string }}</p>

<div class="post">
  {{ content }}
</div>

<nav class="post-nav">
  <div class="post-nav-prev">
    {% if page.next %}
      <a href="{{ page.next.url }}">&larr; {{ page.next.title }}</a>
    {% endif %}
  </div>
  <div class="post-nav-home">
    <a href="/blog">All Posts</a>
  </div>
  <div class="post-nav-next">
    {% if page.previous %}
      <a href="{{ page.previous.url }}">{{ page.previous.title }} &rarr;</a>
    {% endif %}
  </div>
</nav>
